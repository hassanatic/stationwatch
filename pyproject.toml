[project]
name = "stationwatch"
version = "0.1.0"
description = "Quality control and health monitoring for a network of environmental measurement stations"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "pydantic>=2"]
license = { text = "MIT" }

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27", "uvicorn>=0.29"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["stationwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
